version: '3'

vars:
  DB_CLUSTER_HOST: '{{env "DB_CLUSTER_HOST" "n8n-rw.n8n"}}'
  DB_LOCAL_HOST: '{{env "DB_LOCAL_HOST" "10.7.0.6"}}'
  SSH_HOST: '{{env "SSH_HOST" "10.7.0.6"}}'
  BACKUP_FILE: '{{env "BACKUP_FILE"}}'
  S3_ENDPOINT: '{{env "S3_ENDPOINT" "s3.eu-central-3.ionoscloud.com"}}'
  S3_ACCESS_KEY: '{{env "S3_ACCESS_KEY"}}'
  S3_SECRET_KEY: '{{env "S3_SECRET_KEY"}}'
  S3_BUCKET: '{{env "S3_BUCKET" "REDUCTED"}}'
  DB_NAME: '{{env "DB_NAME"}}'

tasks:
  restore-db-cluster:
    desc: Restore DB from the cluster node
    cmds:
      - "ssh root@{{.SSH_HOST}} bash -lc 'cd /volumes/n8n && psql -h {{.DB_CLUSTER_HOST}} -U app -d {{.DB_NAME}} < {{.BACKUP_FILE}}'"

  restore-db-localhost:
    desc: Restore DB from localhost
    cmds:
      - '/home/fritz/projects/github/lab-ansible/roles/scripts/files/restic.sh restore "{{.S3_ENDPOINT}}" "/volumes/n8n" "{{.S3_ACCESS_KEY}}" "{{.S3_SECRET_KEY}}" "{{.S3_BUCKET}}"'
      - "ssh root@{{.SSH_HOST}} bash -lc 'nohup socat TCP-LISTEN:5432,reuseaddr,fork TCP:{{.DB_CLUSTER_HOST}}:5432 >/dev/null 2>&1 & sleep 0.5'"
      - "psql -h {{.DB_LOCAL_HOST}} -U app -d {{.DB_NAME}} < {{.BACKUP_FILE}}"
