alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
    - alertmanager-smtp
    alertmanagerConfigMatcherStrategy:
      type: None
  config:
    global:
      smtp_smarthost: 'smtp.easyname.com:465'
      smtp_from: 'fritz@duchardt.net'
      smtp_require_tls: false
      smtp_auth_username: 'fritz@duchardt.net'
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp_auth_password

grafana:
  assertNoLeakedSecrets: false
  ingress:
    enabled: true
    ingressClassName: "nginx"
    hosts:
      - grafana.duchardt.net
    tls:
     - secretName: grafana-certificate
       hosts:
        - grafana.duchardt.net
  admin:
    existingSecret: grafana-secret
  persistence:
    enabled: true
  sidecar:
    datasources:
      url: http://prometheus-operated:9090/
      alertmanager:
        enabled: false
  grafana.ini:
    server:
      root_url: https://grafana.duchardt.net
    auth.generic_oauth:
      enabled: true
      name: Keycloak-OAuth
      allow_sign_up: true
      client_id: grafana
      client_secret: '<path:kv/data/kube-prometheus-stack/grafana-client-secret#secret>'
      scopes: "openid email profile offline_access roles"
      email_attribute_path: email
      login_attribute_path: username
      name_attribute_path: full_name
      auth_url: https://keycloak.duchardt.net/auth/realms/master/protocol/openid-connect/auth
      token_url: https://keycloak.duchardt.net/auth/realms/master/protocol/openid-connect/token
      api_url: https://keycloak.duchardt.net/auth/realms/master/protocol/openid-connect/userinfo
      role_attribute_path: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'"
      allow_assign_grafana_admin: true
prometheus:
  ingress:
    ingressClassName: "nginx"
    enabled: false
    hosts:
      - prometheus.friclu
  prometheusSpec:
    ruleNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}

