#@ load("@ytt:data", "data")
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-config
spec:
  route:
    groupBy: ['alertname', 'severity']
    groupWait: 5s
    groupInterval: 5s
    repeatInterval: 24h
    receiver: SilenceAlert
    routes:
      - matchers:
        - matchType: =
          name: severity
          value: critical
        receiver: "critical-email"
  receivers:
    - name: SilenceAlert
    - name: "critical-email"
      emailConfigs:
      - to: "fritz@duchardt.net"
