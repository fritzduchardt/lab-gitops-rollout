#@ load("@ytt:data", "data")
---
#@ if data.values.certificate.enabled:
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-certificate
spec:
  secretName: grafana-certificate
  duration: 2160h
  renewBefore: 360h
  subject:
    organizations:
      - friclu
  dnsNames:
    - grafana.duchardt.net
  issuerRef:
    name: http01
    kind: ClusterIssuer
#@ end
