image:
  tag: "26.3.3"

ingress:
  enabled: true
  ingressClassName: "nginx"
  rules:
    -
      host: 'catchat-friclu.duckdns.org'
      paths:
        - path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/'
          pathType: Prefix
  tls:
    - hosts:
        - catchat-friclu.duckdns.org
      secretName: "keycloak-certificate"

database:
  existingSecret: "keycloak-app"
  vendor: postgres
  hostname: keycloak-rw
  port: 5432
  database: app
  username: app

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-port=8080"
  - "--hostname-strict=false"
extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    value: admin
  - name: JAVA_OPTS_APPEND
    value: >-
      -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless
