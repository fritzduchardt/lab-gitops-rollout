---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nc-volume
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /volumes/nc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nc-volume
  labels:
    name: nc-volume
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
