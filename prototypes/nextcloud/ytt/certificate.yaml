  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: nc-certificate
  spec:
    secretName: nc-certificate
    duration: 2160h
    renewBefore: 360h
    subject:
      organizations:
        - friclu
    dnsNames:
      - nc-friclu.duckdns.org
    issuerRef:
      name: duckdns-github-production
      kind: ClusterIssuer
