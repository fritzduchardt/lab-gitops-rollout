  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: pihole-certificate
  spec:
    secretName: pihole-certificate
    duration: 2160h
    renewBefore: 360h
    subject:
      organizations:
        - friclu
    dnsNames:
      - pihole.duchardt.net
    issuerRef:
      name: http01
      kind: ClusterIssuer
