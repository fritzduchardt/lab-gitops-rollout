global:
  dnsService: "coredns"
chunksCache:
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 1Gi
loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    ingestion_rate_mb: 4              # Max MB/s per tenant
    ingestion_burst_size_mb: 6        # Burst allowance
    per_stream_rate_limit: 3MB        # Per stream rate
    per_stream_rate_limit_burst: 15MB
    max_streams_per_user: 10000
    max_line_size: 256kb
    allow_structured_metadata: true
    volume_enabled: true
  ruler:
    enable_api: true
  storage:
    use_thanos_objstore: true
    object_store:
      # Type of object store. Valid options are: s3, gcs, azure
      type: s3
      s3:
        endpoint: eu2.contabostorage.com
        region: eu
        access_key_id: <path:kv/data/shared/contabo-s3#access-key>
        secret_access_key: <path:kv/data/shared/contabo-s3#secret-key>
    bucketNames:
       chunks: friclu-loki-chunks
       ruler: friclu-loki-ruler
  auth_enabled: false

deploymentMode: SingleBinary

singleBinary:
  replicas: 1

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

gateway:
  enabled: false
