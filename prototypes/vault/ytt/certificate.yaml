#@ load("@ytt:data", "data")
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-certificate
  namespace: #@ data.values.helm.namespace
spec:
  secretName: vault-certificate
  duration: 2160h
  renewBefore: 360h
  subject:
    organizations:
      - friclu
  dnsNames:
    - frault.duckdns.org
  issuerRef:
    name: duckdns-github-2-production
    kind: ClusterIssuer
