#@ load("@ytt:data", "data")
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-certificate
  namespace: #@ data.values.helm.namespace
spec:
  secretName: vault-certificate
  duration: 2160h
  renewBefore: 360h
  subject:
    organizations:
      - friclu
  dnsNames:
    - vault.duchardt.net
  issuerRef:
    name: http01
    kind: ClusterIssuer
