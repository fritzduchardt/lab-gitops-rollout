apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: windmill-certificate
spec:
  secretName: windmill-certificate
  duration: 2160h
  renewBefore: 360h
  subject:
    organizations:
      - friclu
  dnsNames:
    - windmill.duchardt.net
  issuerRef:
    name: http01
    kind: ClusterIssuer
