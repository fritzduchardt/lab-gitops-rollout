---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /volumes/immich
  storageClassName: "immich"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  labels:
    name: immich-library
spec:
  storageClassName: "immich"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
