  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: n8n-certificate
  spec:
    secretName: n8n-certificate
    duration: 2160h
    renewBefore: 360h
    subject:
      organizations:
        - friclu
    dnsNames:
      - n8n.duchardt.net
    issuerRef:
      name: http01
      kind: ClusterIssuer
