apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app: cert-manager-webhook-duckdns
    chart: cert-manager-webhook-duckdns-v1.2.3
    heritage: Helm
    release: cert-manager-webhook-duckdns-github
  name: duckdns-github-webhook-tls
  namespace: cert-manager
spec:
  dnsNames:
    - duckdns-github
    - duckdns-github.cert-manager
    - duckdns-github.cert-manager.svc
  duration: 8760h
  issuerRef:
    name: duckdns-github-ca
  secretName: duckdns-github-webhook-tls
