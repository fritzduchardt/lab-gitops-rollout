apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app: cert-manager-webhook-duckdns
    chart: cert-manager-webhook-duckdns-v1.2.3
    heritage: Helm
    release: cert-manager-webhook-duckdns-google
  name: duckdns-google-webhook-tls
  namespace: cert-manager
spec:
  dnsNames:
    - duckdns-google
    - duckdns-google.cert-manager
    - duckdns-google.cert-manager.svc
  duration: 8760h
  issuerRef:
    name: duckdns-google-ca
  secretName: duckdns-google-webhook-tls
