apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  labels:
    app: minio
  name: thanos
  namespace: thanos
spec:
  buckets:
    - name: thanos
  configuration:
    name: myminio-env-configuration
  features:
    bucketDNS: true
    enableSFTP: false
  image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
  imagePullPolicy: IfNotPresent
  mountPath: /export
  podManagementPolicy: Parallel
  pools:
    - name: pool-0
      nodeSelector:
        kubernetes.io/hostname: friclu-2
      servers: 1
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
      volumesPerServer: 1
  poolsMetadata:
    annotations: {}
    labels: {}
  prometheusOperator: false
  requestAutoCert: true
  subPath: /data
