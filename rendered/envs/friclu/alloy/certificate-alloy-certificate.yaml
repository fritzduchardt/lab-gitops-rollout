apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alloy-certificate
  namespace: alloy
spec:
  dnsNames:
    - alloy.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: alloy-certificate
  subject:
    organizations:
      - friclu
