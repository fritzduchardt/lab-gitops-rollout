apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mkdocs
  namespace: fritzgpt
spec:
  dnsNames:
    - yummy.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  privateKey:
    rotationPolicy: Always
  renewBefore: 360h
  secretName: mkdocs-certificate
  subject:
    organizations:
      - friclu
