apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pihole-certificate
  namespace: pihole
spec:
  dnsNames:
    - pihole-friclu.duckdns.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: duckdns-google-production
  renewBefore: 360h
  secretName: pihole-certificate
  subject:
    organizations:
      - friclu
