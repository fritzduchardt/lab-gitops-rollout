apiVersion: v1
data:
  Corefile: |
    .:53 {
        errors
        cache {
                success 9984 30
                denial 9984 5
        }
        reload
        loop
        bind 169.254.25.10
        forward . 10.233.126.96 {
                force_tcp
        }
        prometheus :9253
        health 169.254.25.10:8080
        }
kind: ConfigMap
metadata:
  labels:
    addonmanager.kubernetes.io/mode: Reconcile
  name: node-local-dns
  namespace: coredns
