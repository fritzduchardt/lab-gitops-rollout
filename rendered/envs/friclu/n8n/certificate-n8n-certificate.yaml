apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-certificate
  namespace: n8n
spec:
  dnsNames:
    - n8n.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: n8n-certificate
  subject:
    organizations:
      - friclu
