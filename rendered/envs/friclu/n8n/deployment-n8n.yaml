apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: n8n
    app.kubernetes.io/version: 1.122.4
    helm.sh/chart: n8n-2.0.1
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/name: n8n
      app.kubernetes.io/type: master
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/config: fcf6c5369768bc91a665a9d3d233cb1af07d5d2d4dbebbe1719bbfd880cb1788
      labels:
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/name: n8n
        app.kubernetes.io/type: master
    spec:
      containers:
        - env:
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_POSTGRESDB_PASSWORD
                  name: n8n-app-secret
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  key: DB_POSTGRESDB_USER
                  name: n8n-app-secret
          envFrom:
            - configMapRef:
                name: n8n-app-config
          image: n8nio/n8n:1.122.4
          imagePullPolicy: IfNotPresent
          lifecycle: {}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          name: n8n
          ports:
            - containerPort: 5678
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources: {}
          securityContext: {}
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: data
            - mountPath: /syncthing
              name: syncthing
            - mountPath: /rendered-patterns
              name: fabric-rendered-patterns
      nodeSelector:
        kubernetes.io/hostname: friclu-1
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: n8n
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n
        - name: syncthing
          persistentVolumeClaim:
            claimName: syncthing
        - name: fabric-rendered-patterns
          persistentVolumeClaim:
            claimName: fabric-rendered-patterns
