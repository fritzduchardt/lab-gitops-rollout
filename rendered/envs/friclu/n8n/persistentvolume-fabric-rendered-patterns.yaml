apiVersion: v1
kind: PersistentVolume
metadata:
  name: fabric-rendered-patterns
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /volumes/fabric/rendered-patterns/
    type: ""
  persistentVolumeReclaimPolicy: Retain
  storageClassName: n8n
  volumeMode: Filesystem
