apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ha-certificate
  namespace: home-assistant
spec:
  dnsNames:
    - ha-friclu.duckdns.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: duckdns-google-production
  renewBefore: 360h
  secretName: ha-certificate
  subject:
    organizations:
      - friclu
