apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ha-certificate
  namespace: home-assistant
spec:
  dnsNames:
    - home.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: ha-certificate
  subject:
    organizations:
      - friclu
