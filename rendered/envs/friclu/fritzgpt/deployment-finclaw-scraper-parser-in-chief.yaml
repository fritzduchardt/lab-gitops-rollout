apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: finclaw-scraper-parser-in-chief
    app.kubernetes.io/name: oneshot
  name: finclaw-scraper-parser-in-chief
  namespace: fritzgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: finclaw-scraper-parser-in-chief
      app.kubernetes.io/name: oneshot
  template:
    metadata:
      labels:
        app.kubernetes.io/component: finclaw-scraper-parser-in-chief
        app.kubernetes.io/name: oneshot
    spec:
      containers:
        - command:
            - sh
            - -c
            - python -m src.finclaw.cli trump scrape
          env:
            - name: ALPACA_API_KEY
              value: <path:kv/data/fritzgpt/finclaw#alpacaApiKey>
            - name: ALPACA_API_SECRET
              value: <path:kv/data/fritzgpt/finclaw#alpacaApiSecret>
            - name: DEEPSEEK_API_KEY
              value: <path:kv/data/fritzgpt/finclaw#deepseekApiKey>
            - name: GOOGLE_API_KEY
              value: <path:kv/data/fritzgpt/finclaw#googleApiKey>
            - name: IG_API_KEY
              value: <path:kv/data/fritzgpt/finclaw#igApiKey>
            - name: IG_BASE_URL
              value: <path:kv/data/fritzgpt/finclaw#igBaseUrl>
            - name: IG_PASSWORD
              value: <path:kv/data/fritzgpt/finclaw#igPassword>
            - name: IG_USERNAME
              value: <path:kv/data/fritzgpt/finclaw#igUsername>
            - name: INTERPRETATION_MODEL
              value: gemini-3.1-flash-lite
            - name: OS_SYNC_PATTERN_DIR
              value: /sync/oneshot/patterns
            - name: PGDATABASE
              value: oneshot
            - name: PGHOST
              value: oneshot-rw
            - name: PGPASSWORD
              value: <path:kv/data/fritzgpt/finclaw#pgpassword>
            - name: PGUSER
              value: app
            - name: POLYGON_API_KEY
              value: <path:kv/data/fritzgpt/finclaw#polygonApiKey>
            - name: PORT
              value: "9000"
            - name: POST_INTERPRET_PATTERN
              value: finclaw_trump_scrape_iran
            - name: RAPIDAPI_KEY
              value: <path:kv/data/fritzgpt/finclaw#rapidAPIKey>
            - name: RELEVANCY_THRESHOLD
              value: "6"
            - name: SCRAPE_ORDER_CLOSE_DELAY_SECONDS
              value: "180"
            - name: SCRAPE_ORDER_SIZE
              value: "0.2"
            - name: SCRAPE_TICKER
              value: CC.D.LCO.UNC.IP
            - name: SCRAPE_TICKER_CURRENCY
              value: USD
            - name: TELEGRAM_BOT_TOKEN
              value: <path:kv/data/fritzgpt/finclaw#finclawTelegramBotToken>
            - name: TELEGRAM_CHAT_ID
              value: <path:kv/data/fritzgpt/finclaw#finclawTelegramChatId>
            - name: TRUTHSOCIAL_TOKEN
              value: <path:kv/data/fritzgpt/finclaw#truthsocialToken>
            - name: X_BEARER_TOKEN
              value: <path:kv/data/fritzgpt/finclaw#xBearerToken>
            - name: LOG_LEVEL
              value: DEBUG
            - name: POLL_INTERVAL
              value: "5"
            - name: POLL_OFFSET
              value: "0"
          image: ghcr.io/fritzduchardt/finclaw:main
          imagePullPolicy: Always
          name: finclaw-scraper
          volumeMounts:
            - mountPath: /sync
              name: sync-dir
      volumes:
        - name: sync-dir
          persistentVolumeClaim:
            claimName: sync-dir
