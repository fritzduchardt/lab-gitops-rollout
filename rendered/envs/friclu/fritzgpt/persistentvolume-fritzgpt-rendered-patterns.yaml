apiVersion: v1
kind: PersistentVolume
metadata:
  name: fritzgpt-rendered-patterns
  namespace: fritzgpt
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /volumes/fabric/rendered-patterns
    type: ""
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
