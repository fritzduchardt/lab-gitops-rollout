apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: oneshot-ui
    app.kubernetes.io/name: oneshot
  name: oneshot-ui
  namespace: fritzgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: oneshot-ui
      app.kubernetes.io/name: oneshot
  template:
    metadata:
      labels:
        app.kubernetes.io/component: oneshot-ui
        app.kubernetes.io/name: oneshot
    spec:
      containers:
        - env:
            - name: API_URL
              value: https://fritzgpt.duchardt.net/backend
            - name: PORT
              value: "3000"
            - name: STREAM_URL
              value: https://fritzgptstream.duchardt.net/
          image: ghcr.io/fritzduchardt/oneshot-ui:main
          imagePullPolicy: Always
          name: oneshot-ui
          ports:
            - containerPort: 3000
