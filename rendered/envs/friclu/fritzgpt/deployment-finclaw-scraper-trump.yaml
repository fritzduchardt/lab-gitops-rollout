apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: finclaw-scraper-trump
    app.kubernetes.io/name: oneshot
  name: finclaw-scraper-trump
  namespace: fritzgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: finclaw-scraper-trump
      app.kubernetes.io/name: oneshot
  template:
    metadata:
      labels:
        app.kubernetes.io/component: finclaw-scraper-trump
        app.kubernetes.io/name: oneshot
    spec:
      containers:
        - command:
            - sh
            - -c
            - python -m src.finclaw.cli trump scrape
          env:
            - name: ALPACA_API_KEY
              value: <path:kv/data/fritzgpt/finclaw#alpacaApiKey>
            - name: ALPACA_API_SECRET
              value: <path:kv/data/fritzgpt/finclaw#alpacaApiSecret>
            - name: DEEPSEEK_API_KEY
              value: <path:kv/data/fritzgpt/finclaw#deepseekApiKey>
            - name: LOG_LEVEL
              value: info
            - name: PGDATABASE
              value: oneshot
            - name: PGHOST
              value: oneshot-rw
            - name: PGPASSWORD
              value: <path:kv/data/fritzgpt/finclaw#pgpassword>
            - name: PGUSER
              value: app
            - name: POLYGON_API_KEY
              value: <path:kv/data/fritzgpt/finclaw#polygonApiKey>
            - name: PORT
              value: "9000"
            - name: TRUTHSOCIAL_TOKEN
              value: <path:kv/data/fritzgpt/finclaw#truthsocialToken>
          image: ghcr.io/fritzduchardt/finclaw:main
          imagePullPolicy: Always
          name: finclaw-scraper-trump
