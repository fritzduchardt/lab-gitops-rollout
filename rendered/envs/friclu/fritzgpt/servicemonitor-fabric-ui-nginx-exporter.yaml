apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: fabric
    component: ui
  name: fabric-ui-nginx-exporter
  namespace: fritzgpt
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
  selector:
    matchLabels:
      app: fabric
      component: ui
