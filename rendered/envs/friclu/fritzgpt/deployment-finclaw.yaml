apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: finclaw
    app.kubernetes.io/name: oneshot
  name: finclaw
  namespace: fritzgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: finclaw
      app.kubernetes.io/name: oneshot
  template:
    metadata:
      labels:
        app.kubernetes.io/component: finclaw
        app.kubernetes.io/name: oneshot
    spec:
      containers:
        - env:
            - name: LOG_LEVEL
              value: info
            - name: PGDATABASE
              value: oneshot
            - name: PGHOST
              value: oneshot-rw
            - name: PGPASSWORD
              value: <path:kv/data/fritzgpt/finclaw#pgpassword>
            - name: PGUSER
              value: app
            - name: PORT
              value: "9000"
          image: ghcr.io/fritzduchardt/finclaw:main
          imagePullPolicy: Always
          name: finclaw
          ports:
            - containerPort: 9000
