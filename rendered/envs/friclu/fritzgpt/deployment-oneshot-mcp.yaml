apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: oneshot-mcp
    app.kubernetes.io/name: oneshot
  name: oneshot-mcp
  namespace: fritzgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: oneshot-mcp
      app.kubernetes.io/name: oneshot
  template:
    metadata:
      labels:
        app.kubernetes.io/component: oneshot-mcp
        app.kubernetes.io/name: oneshot
    spec:
      containers:
        - env:
            - name: PORT
              value: "9000"
            - name: OS_CONFIG_PATTERN_DIR
              value: /sync/oneshot/patterns
            - name: OS_MARKDOWN_BASE_DIR
              value: /sync
            - name: OS_MARKDOWN_VAULT_DIR_1
              value: FritzSync/private
            - name: OS_MARKDOWN_VAULT_DIR_2
              value: BubaFritzShare/private
            - name: LOG_LEVEL
              value: info
            - name: WEAVIATE_HOST
              value: weaviate.weaviate
            - name: WEAVIATE_PORT
              value: "80"
            - name: WEAVIATE_GRPC_HOST
              value: weaviate-grpc.weaviate
            - name: WEAVIATE_GRPC_PORT
              value: "50051"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: oneshot-app
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: oneshot-app
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: oneshot-app
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: oneshot-app
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: oneshot-app
          image: ghcr.io/fritzduchardt/oneshot-mcp:main
          imagePullPolicy: Always
          name: oneshot-mcp
          ports:
            - containerPort: 9000
          volumeMounts:
            - mountPath: /sync
              name: sync-dir
      nodeSelector:
        kubernetes.io/hostname: friclu-1
      volumes:
        - name: sync-dir
          persistentVolumeClaim:
            claimName: sync-dir
