apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: oneshot-mcp
    app.kubernetes.io/name: oneshot
  name: oneshot-mcp
  namespace: fritzgpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: oneshot-mcp
      app.kubernetes.io/name: oneshot
  template:
    metadata:
      labels:
        app.kubernetes.io/component: oneshot-mcp
        app.kubernetes.io/name: oneshot
    spec:
      containers:
        - env:
            - name: OS_CONFIG_PATTERN_DIR
              value: /app/src/.oneshot/patterns
            - name: OS_MARKDOWN_BASE_DIR
              value: /sync
            - name: OS_MARKDOWN_VAULT_DIR_1
              value: FritzSync/private
            - name: OS_MARKDOWN_VAULT_DIR_2
              value: BubaFritzShare/private
            - name: LOG_LEVEL
              value: info
          image: ghcr.io/fritzduchardt/oneshot-mcp:main
          imagePullPolicy: Always
          name: oneshot-mcp
          ports:
            - containerPort: 9000
      nodeSelector:
        kubernetes.io/hostname: friclu-1
