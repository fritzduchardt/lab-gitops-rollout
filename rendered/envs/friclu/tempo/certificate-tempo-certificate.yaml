apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tempo-certificate
  namespace: tempo
spec:
  dnsNames:
    - tempo.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: tempo-certificate
  subject:
    organizations:
      - friclu
