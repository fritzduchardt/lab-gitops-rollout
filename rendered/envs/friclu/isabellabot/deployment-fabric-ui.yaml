apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fabric
    component: ui
  name: fabric-ui
  namespace: isabellabot
spec:
  replicas: null
  selector:
    matchLabels:
      app: fabric
      component: ui
  template:
    metadata:
      annotations:
        checksum/app-js: f256be64cb51d0a2f7795fc59c7b6084f16aaba100a403f8f5e3e47efcedeb34
        checksum/index-html: fb71ccc2a625ce99af286e6a6274073c0ef54490258c789be55d2c8b6e8868a3
        checksum/lib-js: ac6e05713c1fa3dbe07b22a3f3799e3240e1fcf10c7afa4b583ce7452603db8a
        checksum/service-worker-js: defaa6683c6f8b0a62de0b14b6528484344695f078aafc62685d3af6af4386bb
      labels:
        app: fabric
        component: ui
    spec:
      containers:
        - image: ghcr.io/fritzduchardt/fabric-ui:master
          imagePullPolicy: Always
          name: fabric-ui
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /usr/share/nginx/html/app.js
              name: ui-scripts
              subPath: app.js
            - mountPath: /usr/share/nginx/html/lib.js
              name: ui-scripts
              subPath: lib.js
            - mountPath: /usr/share/nginx/html/index.html
              name: ui-scripts
              subPath: index.html
            - mountPath: /usr/share/nginx/html/manifest.json
              name: ui-scripts
              subPath: manifest.json
            - mountPath: /usr/share/nginx/html/service-worker.js
              name: ui-scripts
              subPath: service-worker.js
            - mountPath: /etc/nginx/nginx.conf
              name: ui-nginx-config
              subPath: nginx.conf
        - env:
            - name: SCRAPE_URI
              value: http://127.0.0.1:8080/status
          image: nginx/nginx-prometheus-exporter:latest
          imagePullPolicy: Always
          name: nginx-exporter
          ports:
            - containerPort: 9113
              name: metrics
      volumes:
        - configMap:
            defaultMode: 420
            name: fabric-ui-scripts
          name: ui-scripts
        - configMap:
            defaultMode: 420
            name: fabric-ui-nginx-config
          name: ui-nginx-config
