apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fabric
    component: ui
  name: fabric-ui
  namespace: isabellabot
spec:
  replicas: null
  selector:
    matchLabels:
      app: fabric
      component: ui
  template:
    metadata:
      annotations:
        checksum/app-js: 0c1cde0f5edb36a1b2c0accd3e5ad34d6dad7fe997531d885085eeb47376cb6b
        checksum/index-html: aee3eb199f34d76d3bc67f241095fadb5ea54929407aa4a9b4a1aeb1120fc4c7
        checksum/lib-js: a7c309bf9310b3341b6418fd851726e7ae1f10c3f14cd21e60d6fc528d7cd76a
        checksum/service-worker-js: defaa6683c6f8b0a62de0b14b6528484344695f078aafc62685d3af6af4386bb
      labels:
        app: fabric
        component: ui
    spec:
      containers:
        - image: ghcr.io/fritzduchardt/fabric-ui:master
          imagePullPolicy: Always
          name: fabric-ui
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /usr/share/nginx/html/app.js
              name: ui-scripts
              subPath: app.js
            - mountPath: /usr/share/nginx/html/lib.js
              name: ui-scripts
              subPath: lib.js
            - mountPath: /usr/share/nginx/html/index.html
              name: ui-scripts
              subPath: index.html
            - mountPath: /usr/share/nginx/html/manifest.json
              name: ui-scripts
              subPath: manifest.json
            - mountPath: /usr/share/nginx/html/service-worker.js
              name: ui-scripts
              subPath: service-worker.js
            - mountPath: /etc/nginx/nginx.conf
              name: ui-nginx-config
              subPath: nginx.conf
      volumes:
        - configMap:
            defaultMode: 420
            name: fabric-ui-scripts
          name: ui-scripts
        - configMap:
            defaultMode: 420
            name: fabric-ui-nginx-config
          name: ui-nginx-config
