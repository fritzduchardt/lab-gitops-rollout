apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fabric
    component: ui
  name: fabric-ui
  namespace: isabellabot
spec:
  replicas: null
  selector:
    matchLabels:
      app: fabric
      component: ui
  template:
    metadata:
      annotations:
        checksum/app-js: 9c95034bcbfd9c91a693b7c7941d256ad813bae42c766a6c658e0ab9e0b0b4e9
        checksum/index-html: ead5267e04fccc1faff00dd9cfdc9da61849df5180865f8019fce615989fe0d3
        checksum/lib-js: 1edc41dfc0eb643e2a57915fef9bd8c06e9bb3856641d201385194357513b4a3
        checksum/service-worker-js: defaa6683c6f8b0a62de0b14b6528484344695f078aafc62685d3af6af4386bb
      labels:
        app: fabric
        component: ui
    spec:
      containers:
        - image: ghcr.io/fritzduchardt/fabric-ui:master
          imagePullPolicy: Always
          name: fabric-ui
          ports:
            - containerPort: 8080
          volumeMounts:
            - mountPath: /usr/share/nginx/html/app.js
              name: ui-scripts
              subPath: app.js
            - mountPath: /usr/share/nginx/html/lib.js
              name: ui-scripts
              subPath: lib.js
            - mountPath: /usr/share/nginx/html/index.html
              name: ui-scripts
              subPath: index.html
            - mountPath: /usr/share/nginx/html/manifest.json
              name: ui-scripts
              subPath: manifest.json
            - mountPath: /usr/share/nginx/html/service-worker.js
              name: ui-scripts
              subPath: service-worker.js
            - mountPath: /etc/nginx/nginx.conf
              name: ui-nginx-config
              subPath: nginx.conf
        - env:
            - name: OAUTH2_PROXY_PROVIDER
              value: keycloak-oidc
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://fricloak.duckdns.org/auth/realms/master
            - name: OAUTH2_PROXY_CLIENT_ID
              value: fabric
            - name: OAUTH2_PROXY_CLIENT_SECRET
              value: <path:kv/data/shared/fabric#clientSecret>
            - name: OAUTH2_PROXY_COOKIE_SECRET
              value: <path:kv/data/shared/fabric#cookieSecret>
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: http://127.0.0.1:8888
            - name: OAUTH2_PROXY_UPSTREAM
              value: http://127.0.0.1:8080
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: ""
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: '*'
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
          imagePullPolicy: Always
          name: oauth2-proxy
          ports:
            - containerPort: 8888
              name: http
      volumes:
        - configMap:
            defaultMode: 420
            name: fabric-ui-scripts
          name: ui-scripts
        - configMap:
            defaultMode: 420
            name: fabric-ui-nginx-config
          name: ui-nginx-config
