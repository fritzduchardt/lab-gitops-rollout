apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: 300s
    nginx.ingress.kubernetes.io/proxy-keepalive-timeout: 300s
    nginx.ingress.kubernetes.io/proxy-read-timeout: 300s
    nginx.ingress.kubernetes.io/proxy-send-timeout: 300s
  labels:
    app.kubernetes.io/component: nginx
    app.kubernetes.io/name: oneshot
  name: oneshot-nginx
  namespace: isabellabot
spec:
  ingressClassName: nginx
  rules:
    - host: isabellabot.duchardt.net
      http:
        paths:
          - backend:
              service:
                name: oneshot-nginx
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - isabellabot.duchardt.net
      secretName: oneshot-certificate
