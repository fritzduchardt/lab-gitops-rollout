apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fabric-certificate
  namespace: isabellabot
spec:
  dnsNames:
    - isabellabot.duckdns.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: duckdns-github-production
  renewBefore: 360h
  secretName: fabric-certificate
  subject:
    organizations:
      - friclu
