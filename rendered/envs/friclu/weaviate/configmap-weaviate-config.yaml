apiVersion: v1
data:
  conf.yaml: |-
    ---
    authentication:
      anonymous_access:
        enabled: true
      oidc:
        enabled: false
    authorization:
      admin_list:
        enabled: false
      rbac:
        enabled: false

    contextionary:
      url: contextionary.weaviate.svc.cluster.local.:9999

    query_defaults:
      limit: 100
    debug: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: weaviate
  name: weaviate-config
