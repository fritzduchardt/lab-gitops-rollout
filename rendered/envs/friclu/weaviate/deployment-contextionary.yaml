apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: contextionary
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: weaviate
    name: contextionary
  name: contextionary
  namespace: weaviate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contextionary
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: contextionary
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: weaviate
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - weaviate
                topologyKey: kubernetes.io/hostname
              weight: 1
      containers:
        - env:
            - name: OCCURRENCE_WEIGHT_LINEAR_FACTOR
              value: "0.75"
            - name: EXTENSIONS_STORAGE_MODE
              value: weaviate
            - name: EXTENSIONS_STORAGE_ORIGIN
              value: http://weaviate.weaviate.svc.cluster.local.
            - name: NEIGHBOR_OCCURRENCE_IGNORE_PERCENTILE
              value: "5"
            - name: ENABLE_COMPOUND_SPLITTING
              value: "false"
          image: cr.weaviate.io/semitechnologies/contextionary:en0.16.0-v1.2.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 3
            tcpSocket:
              port: 9999
            timeoutSeconds: 3
          name: contextionary
          readinessProbe:
            initialDelaySeconds: 120
            periodSeconds: 3
            tcpSocket:
              port: 9999
          resources: {}
      securityContext: {}
