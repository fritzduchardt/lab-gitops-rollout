apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gpt4all-inference
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: weaviate
    name: gpt4all-inference
  name: gpt4all-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpt4all-inference
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gpt4all-inference
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - weaviate
                topologyKey: kubernetes.io/hostname
              weight: 1
      containers:
        - image: cr.weaviate.io/semitechnologies/gpt4all-inference:all-MiniLM-L6-v2
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /.well-known/live
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 3
            timeoutSeconds: 3
          name: gpt4all-inference
          readinessProbe:
            httpGet:
              path: /.well-known/ready
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 3
          resources: {}
      securityContext: {}
