apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: weaviate
  name: weaviate-headless
  namespace: weaviate
spec:
  clusterIP: None
  ports:
    - port: 80
      protocol: TCP
      targetPort: 7000
  publishNotReadyAddresses: true
  selector:
    app: weaviate
  type: ClusterIP
