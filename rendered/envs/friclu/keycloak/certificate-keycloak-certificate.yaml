apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-certificate
  namespace: keycloak
spec:
  dnsNames:
    - fricloak.duckdns.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: duckdns-github-2-production
  renewBefore: 360h
  secretName: keycloak-certificate
  subject:
    organizations:
      - friclu
