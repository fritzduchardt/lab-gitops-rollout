apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-certificate
  namespace: keycloak
spec:
  dnsNames:
    - keycloak.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: keycloak-certificate
  subject:
    organizations:
      - friclu
