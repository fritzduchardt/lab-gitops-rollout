apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-certificate
  namespace: vault
spec:
  dnsNames:
    - frault.duckdns.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: duckdns-github-2-production
  renewBefore: 360h
  secretName: vault-certificate
  subject:
    organizations:
      - friclu
