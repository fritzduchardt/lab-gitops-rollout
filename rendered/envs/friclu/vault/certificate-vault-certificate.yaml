apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-certificate
  namespace: vault
spec:
  dnsNames:
    - vault.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: vault-certificate
  subject:
    organizations:
      - friclu
