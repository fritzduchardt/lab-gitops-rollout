apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: finclaw
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: finclaw
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: finclaw-0.1.0
  name: finclaw
  namespace: finclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: finclaw
      app.kubernetes.io/name: finclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: finclaw
        app.kubernetes.io/name: finclaw
    spec:
      containers:
        - env:
            - name: RAPID
              value: <path:kv/data/finclaw#rapid>
            - name: TWELVE_DATA
              value: <path:kv/data/finclaw#twelveData>
            - name: WEATHER_API
              value: <path:kv/data/finclaw#weatherAPI>
          image: ghcr.io/fritzduchardt/finclaw:main
          imagePullPolicy: Always
          name: finclaw
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
