apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: windmill-certificate
  namespace: windmill
spec:
  dnsNames:
    - windmill.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: windmill-certificate
  subject:
    organizations:
      - friclu
