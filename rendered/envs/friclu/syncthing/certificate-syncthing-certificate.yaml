apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: syncthing-certificate
  namespace: syncthing
spec:
  dnsNames:
    - sync.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: syncthing-certificate
  subject:
    organizations:
      - friclu
