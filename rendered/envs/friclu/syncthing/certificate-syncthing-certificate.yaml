apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: syncthing-certificate
  namespace: syncthing
spec:
  dnsNames:
    - syncthing-friclu.duckdns.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: duckdns-google-production
  renewBefore: 360h
  secretName: syncthing-certificate
  subject:
    organizations:
      - friclu
