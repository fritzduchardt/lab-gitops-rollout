apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argoapps
spec:
  destination:
    name: in-cluster
    namespace: argoapps
  project: default
  source:
    path: rendered/argocd/friclu
    repoURL: https://github.com/fritzduchardt/lab-gitops-rollout.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
