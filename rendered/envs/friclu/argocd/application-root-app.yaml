apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  destination:
    name: in-cluster
  project: friclu
  source:
    path: rendered/argocd/friclu
    repoURL: https://github.com/fritzduchardt/lab-gitops-rollout.git
    targetRevision: HEAD
  syncPolicy: {}
