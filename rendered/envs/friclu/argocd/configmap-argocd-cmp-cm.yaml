apiVersion: v1
data:
  argocd-vault-plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: argocd-vault-plugin
    spec:
      discover:
        find:
          command:
          - sh
          - -c
          - find . -name '*.yaml' | xargs -I {} grep "<path" {} | grep .
          glob: '**/*.yaml'
      generate:
        command:
        - sh
        - -c
        - argocd-vault-plugin generate . -s vault-configuration
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: repo-server
    app.kubernetes.io/instance: argo-cd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argocd-cmp-cm
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: v3.1.8
    helm.sh/chart: argo-cd-8.6.0
  name: argocd-cmp-cm
  namespace: argocd
