apiVersion: v1
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      basicAuth: false
      jsonData:
        nodeGraph:
          enabled: true
        search:
          hide: false
        serviceMap:
          datasourceUid: prometheus
        spanBar:
          tag: http.path
          type: Tag
        streamingEnabled:
          search: true
        traceQuery:
          spanEndTimeShift: 1h
          spanStartTimeShift: -1h
          timeShiftEnabled: true
        tracesToLogsV2:
          customQuery: true
          datasourceUid: loki
          filterBySpanID: false
          filterByTraceID: false
          query: method="$${__span.tags.method}"
          spanEndTimeShift: 1h
          spanStartTimeShift: -1h
          tags:
          - job
          - instance
          - pod
          - namespace
        tracesToMetrics:
          datasourceUid: prom
          queries:
          - name: Sample query
            query: sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m]))
          spanEndTimeShift: 1h
          spanStartTimeShift: -1h
          tags:
          - key: service.name
            value: service
          - key: job
        tracesToProfiles:
          customQuery: true
          datasourceUid: grafana-pyroscope-datasource
          profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
          query: method="$${__span.tags.method}"
          tags:
          - job
          - instance
          - pod
          - namespace
      name: Tempo
      type: tempo
      uid: EbPG8fYoz
      url: http://tempo.tempo:3200
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [auth.generic_oauth]
    allow_assign_grafana_admin = true
    allow_sign_up = true
    api_url = https://keycloak.duchardt.net/auth/realms/master/protocol/openid-connect/userinfo
    auth_url = https://keycloak.duchardt.net/auth/realms/master/protocol/openid-connect/auth
    client_id = grafana
    client_secret = <path:kv/data/kube-prometheus-stack/grafana-client-secret#secret>
    email_attribute_path = email
    enabled = true
    login_attribute_path = username
    name = Keycloak-OAuth
    name_attribute_path = full_name
    role_attribute_path = contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
    scopes = openid email profile offline_access roles
    token_url = https://keycloak.duchardt.net/auth/realms/master/protocol/openid-connect/token
    [grafana_net]
    url = https://grafana.net
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = grafana.duchardt.net
    root_url = https://grafana.duchardt.net
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 12.1.1
    helm.sh/chart: grafana-10.0.0
  name: kube-prometheus-stack-grafana
  namespace: kube-prometheus-stack
