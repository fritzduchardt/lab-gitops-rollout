apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-certificate
  namespace: kube-prometheus-stack
spec:
  dnsNames:
    - grafana.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: grafana-certificate
  subject:
    organizations:
      - friclu
