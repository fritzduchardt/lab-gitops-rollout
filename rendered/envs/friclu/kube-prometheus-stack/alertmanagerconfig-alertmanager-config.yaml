apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-config
  namespace: kube-prometheus-stack
spec:
  receivers:
    - name: SilenceAlert
    - emailConfigs:
        - to: fritz@duchardt.net
      name: critical-email
  route:
    groupBy:
      - alertname
      - severity
    groupInterval: 5s
    groupWait: 5s
    receiver: SilenceAlert
    repeatInterval: 24h
    routes:
      - matchers:
          - matchType: =
            name: severity
            value: critical
        receiver: critical-email
