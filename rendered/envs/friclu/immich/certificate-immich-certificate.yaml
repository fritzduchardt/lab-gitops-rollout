apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-certificate
  namespace: immich
spec:
  dnsNames:
    - immich.duchardt.net
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: http01
  renewBefore: 360h
  secretName: immich-certificate
  subject:
    organizations:
      - friclu
