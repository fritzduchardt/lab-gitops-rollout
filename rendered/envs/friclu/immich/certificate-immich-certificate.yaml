apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-certificate
  namespace: immich
spec:
  dnsNames:
    - immich-friclu.duckdns.org
  duration: 2160h
  issuerRef:
    kind: ClusterIssuer
    name: duckdns-github-production
  renewBefore: 360h
  secretName: immich-certificate
  subject:
    organizations:
      - friclu
