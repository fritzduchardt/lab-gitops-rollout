apiVersion: v1
data:
  karma.conf: |
    alertmanager:
      interval: 30s
      servers:
      - healthcheck:
          filters:
            Watchdog:
            - alertname=Watchdog
        name: alertmanager
        proxy: true
        timeout: 10s
        uri: https://<path:kv/data/shared/basicauth#authplain>@alertmanager.duchardt.net
    history:
      enabled: false
kind: ConfigMap
metadata:
  labels:
    app: karma
    chart: karma-2.11.0
    heritage: Helm
    release: karma
  name: karma-config
  namespace: karma
