apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: friclu
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for "friclu" environment
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  destinations:
  - namespace: '*'
    name: friclu
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - '*'
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    argocd.argoproj.io/secret-type: cluster
  name: friclu
  namespace: argocd
stringData:
  config: ARGOCD_CLUSTER_CONNECT_CONFIG
  name: friclu
  project: friclu
  server: ARGOCD_CLUSTER_SERVER_URL
