apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: friclu-pushgateway
  namespace: argo
spec:
  destination:
    name: in-cluster
    namespace: pushgateway
  project: friclu
  source:
    path: rendered/envs/friclu/pushgateway
    repoURL: https://github.com/fritzduchardt/lab-gitops-rollout.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - ApplyOutOfSyncOnly=true
