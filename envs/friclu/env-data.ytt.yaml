#@data/values
---
argocd:
  namespace: argocd
  env:
    generateSecret: false
  project:
    enabled: false
  app:
    destination:
      name: "in-cluster"
    source:
      repoURL: "https://github.com/fritzduchardt/lab-gitops-rollout.git"
      targetRevision: "HEAD"
    syncPolicy:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - ApplyOutOfSyncOnly=true
environment:
  id: friclu
  applications:
