#@data/values
---
argocd:
  env:
    generateSecret: false
  project:
    enabled: false
  app:
    destination:
      name: "in-cluster"
    source:
      repoURL: "https://github.com/fritzduchardt/lab-gitops-rollout.git"
      targetRevision: "HEAD"
environment:
  id: friclu
  applications:
    - proto: alloy
    - proto: argocd
    - proto: cert-manager
    - name: cloudnative-pg
      proto: cloudnative-pg
    - name: fritzgpt
      proto: fabric
    - proto: home-assistant
    - name: isabellabot
      proto: fabric
    - proto: immich
    - name: keycloak
      proto: keycloak
    - proto: kube-prometheus-stack
    - proto: linkding
    - proto: local-path-provisioner
    - proto: loki
    - name: munchkinchat
      proto: fabric
    - proto: nginx
    - name: n8n
      proto: n8n
    - proto: ollama
    - proto: proto
    - proto: pushgateway
    - proto: registry
    - proto: syncthing
    - proto: tempo
    - name: vault
      proto: vault
    - proto: vector
    - proto: weaviate
