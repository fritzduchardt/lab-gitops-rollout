#@data/values
---
argocd:
  env:
    generateSecret: false
  project:
    enabled: false
  app:
    destination:
      name: "in-cluster"
    source:
      repoURL: "https://github.com/fritzduchardt/lab-gitops-rollout.git"
      targetRevision: "HEAD"
    syncPolicy:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - ApplyOutOfSyncOnly=true
environment:
  id: friclu
  applications:
    - proto: alloy
    - proto: argocd
    - proto: cert-manager
    - proto: cloudnative-pg
    - name: fritzgpt
      proto: fabric
    - proto: home-assistant
    - name: isabellabot
      proto: fabric
    - proto: immich
    - proto: keycloak
    - proto: kube-prometheus-stack
    - proto: linkding
    - proto: local-path-provisioner
    - proto: loki
    - name: munchkinchat
      proto: fabric
    - proto: nginx
    - proto: n8n
    - proto: pushgateway
    - proto: registry
    - proto: syncthing
    - proto: tempo
    - proto: vault
    - proto: weaviate
