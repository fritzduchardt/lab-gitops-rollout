#@data/values
---
argocd:
  app:
    destination:
      name: "in-cluster"
    source:
      repoURL: "https://github.com/fritzduchardt/lab-gitops-rollout.git"
      targetRevision: "HEAD"
environment:
  id: friclu
  applications:
    - proto: argocd
    - proto: coredns
    - proto: localdns
    - proto: nginx
    - proto: local-path-provisioner
    - proto: cert-manager
    - proto: registry
    - proto: immich
    - proto: home-assistant
    - proto: syncthing
    - proto: pihole
    - proto: linkding
    - proto: kube-prometheus-stack
    - proto: pushgateway
    - proto: ollama
    - name: fritzgpt
      proto: fabric
    - name: catchat
      proto: fabric
    - name: munchkinchat
      proto: fabric
    - name: vault
      proto: vault
